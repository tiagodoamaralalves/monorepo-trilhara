quarkus.application.name=backend-trilhara-quarkus
quarkus.http.port=${PORT:8080}
quarkus.http.test-port=0
quarkus.http.host=0.0.0.0
quarkus.http.static-resources.caching-enabled=false

quarkus.mongodb.connection-string=${MONGODB_URL:mongodb://localhost:27017/?minPoolSize=5&maxPoolSize=50}
quarkus.mongodb.database=trilhara
quarkus.mongodb.connect-timeout=PT5S
quarkus.mongodb.read-timeout=PT10S
quarkus.mongodb.server-selection-timeout=PT3S
quarkus.mongodb.max-connection-idle-time=PT15M
quarkus.mongodb.max-connection-life-time=PT60M
%test.quarkus.mongodb.database=trilhara_test
%test.quarkus.mongodb.connection-string=${MONGODB_URL:mongodb://172.22.0.2:27017}
%test.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.image-name=mongo:7-jammy

quarkus.smallrye-openapi.info-title=API do Trilhara
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# Atras do proxy reverso (Caddy): respeita X-Forwarded-*
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true

# Limite de tamanho do corpo HTTP (REC-001)
quarkus.http.limits.max-body-size=2M

# Cabecalhos de seguranca HTTP (REC-002)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# ============================================================================
# Autenticacao, Autorizacao e Seguranca (JWT, Refresh Token, Rate Limit, CORS)
# ============================================================================
trilhara.auth.jwt.secret=${AUTH_JWT_SECRET}
%dev.trilhara.auth.jwt.secret=trilhara-dev-jwt-secret-key-with-at-least-256-bits-for-hs256-signing-2026
%test.trilhara.auth.jwt.secret=trilhara-test-jwt-secret-key-with-at-least-256-bits-for-hs256-signing-2026
trilhara.auth.jwt.issuer=${AUTH_JWT_ISSUER:https://trilhara.com.br}
trilhara.auth.jwt.audience=${AUTH_JWT_AUDIENCE:trilhara-web}
trilhara.auth.jwt.access-expiration-seconds=${AUTH_JWT_ACCESS_EXP_SECONDS:900}
trilhara.auth.jwt.clock-skew-seconds=${AUTH_JWT_CLOCK_SKEW_SECONDS:30}

trilhara.auth.refresh.expiration-days=${AUTH_REFRESH_EXP_DAYS:30}
trilhara.auth.refresh.cookie-name=${AUTH_REFRESH_COOKIE_NAME:trilhara_rt}
trilhara.auth.refresh.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:true}
trilhara.auth.refresh.cookie-same-site=${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
trilhara.auth.refresh.cookie-domain=${AUTH_REFRESH_COOKIE_DOMAIN:}
trilhara.auth.refresh.grace-period-seconds=${AUTH_REFRESH_GRACE_PERIOD_SECONDS:10}
trilhara.auth.session-state.cookie-name=${AUTH_SESSION_STATE_COOKIE_NAME:trilhara_session_state}
trilhara.auth.session-state.cookie-same-site=${AUTH_SESSION_STATE_COOKIE_SAMESITE:Lax}
%dev.trilhara.auth.refresh.cookie-secure=false
%test.trilhara.auth.refresh.cookie-secure=false
%test.trilhara.auth.refresh.cookie-same-site=Strict
%test.trilhara.auth.refresh.grace-period-seconds=0
%test.trilhara.auth.test-fallback-user-id=60c72b2f9b1d8b2bad000001

trilhara.auth.password.iterations=${AUTH_PASSWORD_ITERATIONS:310000}
%test.trilhara.auth.password.iterations=15000
trilhara.auth.password.pepper=${AUTH_PASSWORD_PEPPER}
%dev.trilhara.auth.password.pepper=trilhara-dev-pepper
%test.trilhara.auth.password.pepper=trilhara-test-pepper
trilhara.auth.reset.expiration-minutes=${AUTH_RESET_EXP_MINUTES:15}

trilhara.auth.bruteforce.max-failures=${AUTH_MAX_LOGIN_FAILURES:5}
trilhara.auth.bruteforce.lock-minutes=${AUTH_LOCK_MINUTES:15}
trilhara.auth.ratelimit.login-max=${AUTH_RATELIMIT_LOGIN_MAX:10}
trilhara.auth.ratelimit.cadastro-max=${AUTH_RATELIMIT_CADASTRO_MAX:10}
trilhara.auth.ratelimit.window-seconds=${AUTH_RATELIMIT_WINDOW_SECONDS:60}

# Modo estrito de autenticacao nas rotas de negocio (/api/trilhas, /api/admin)
# Padrao seguro: autenticacao obrigatoria, exceto em dev/test com override explicito
trilhara.auth.strict-mode=${AUTH_STRICT_MODE:true}
%dev.trilhara.auth.strict-mode=false
%test.trilhara.auth.strict-mode=false
trilhara.trilhas.max-por-usuario=${TRILHAS_MAX_POR_USUARIO:50}
%test.trilhara.trilhas.max-por-usuario=100000
trilhara.auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:8080}

# ============================================================================
# Servico de Envio de E-mail (Resend API)
# ============================================================================
trilhara.email.resend-api-key=${RESEND_API_KEY:re_Rz7QRSXP_64zcchqPwncF96bDZDXibrrb}
trilhara.email.from=${EMAIL_FROM:Trilhara <onboarding@resend.dev>}
trilhara.email.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ============================================================================
# Web Push e VAPID (RFC 8030 / RFC 8292) - FASE 10
# ============================================================================
trilhara.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
trilhara.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
trilhara.push.vapid.subject=${VAPID_SUBJECT:mailto:suporte@trilhara.com.br}
trilhara.push.habilitado=${PUSH_HABILITADO:true}
trilhara.push.scheduler.interval=30s
%test.trilhara.push.scheduler.interval=60m

