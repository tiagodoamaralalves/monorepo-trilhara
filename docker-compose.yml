services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: trilhara_caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - CADDY_GLOBAL_OPTIONS=${CADDY_GLOBAL_OPTIONS:-auto_https off}
      - EXPOSE_QUARKUS_DEV_UI=${EXPOSE_QUARKUS_DEV_UI:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_net
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging: &default_logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  app:
    build: .
    container_name: trilhara_app
    expose:
      - "8080"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/?minPoolSize=${MONGODB_MIN_POOL_SIZE:-5}&maxPoolSize=${MONGODB_MAX_POOL_SIZE:-50}
      - AUTH_STRICT_MODE=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?defina AUTH_JWT_SECRET (min. 32 bytes)}
      - AUTH_PASSWORD_PEPPER=${AUTH_PASSWORD_PEPPER:?defina AUTH_PASSWORD_PEPPER}
      - AUTH_REFRESH_COOKIE_SECURE=${AUTH_REFRESH_COOKIE_SECURE:-false}
      - AUTH_REFRESH_COOKIE_SAMESITE=${AUTH_REFRESH_COOKIE_SAMESITE:-Lax}
      - AUTH_REFRESH_COOKIE_DOMAIN=${AUTH_REFRESH_COOKIE_DOMAIN:-}
      - AUTH_CORS_ALLOWED_ORIGINS=${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost,http://estudos.localhost,http://tarefas.localhost,http://notas.localhost,http://pomodoro.localhost}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Trilhara <onboarding@resend.dev>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:suporte@trilhara.com.br}
      - PUSH_HABILITADO=${PUSH_HABILITADO:-true}
      - TAREFAS_APP_URL=${TAREFAS_APP_URL:-http://localhost/tarefas/}
      - TAREFAS_APP_URL_ALLOWLIST=${TAREFAS_APP_URL_ALLOWLIST:-http://localhost,http://localhost:5173,http://localhost:80}
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    networks:
      - edge_net
      - internal_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default_logging
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: trilhara_mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.5}", "--bind_ip_all", "--quiet"]
    # Sem "ports": acessivel apenas pela rede interna do compose.
    volumes:
      - ./data/mongo:/data/db
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default_logging
    restart: unless-stopped

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
